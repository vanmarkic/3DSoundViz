<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">
  <title>AutoVJ - Audio Visual Experience</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
    }

    #app-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* UI Container */
    .ui-container {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 320px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .ui-header h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .ui-header p {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }

    .ui-header kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
    }

    .ui-section {
      margin-bottom: 20px;
    }

    .ui-section h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Parameter Controls */
    .param-control {
      margin-bottom: 16px;
    }

    .param-control label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #ccc;
    }

    .param-control input[type="range"] {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
      margin-bottom: 4px;
    }

    .param-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: #ff0000;
      cursor: pointer;
      border-radius: 50%;
      border: 2px solid #ffffff;
    }

    .param-control input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #ff0000;
      cursor: pointer;
      border-radius: 50%;
      border: 2px solid #ffffff;
    }

    .param-value {
      display: inline-block;
      font-size: 11px;
      font-family: monospace;
      color: #888;
      float: right;
      margin-top: -20px;
    }

    /* Stats Display */
    .ui-stats {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11px;
    }

    .stats-grid div {
      display: flex;
      justify-content: space-between;
    }

    .stats-grid span:first-child {
      color: #888;
    }

    .stats-grid span:last-child {
      color: #fff;
      font-family: monospace;
      font-weight: 600;
    }

    /* Actions */
    .ui-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ui-actions button {
      flex: 1;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ui-actions button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .ui-actions button:active {
      transform: scale(0.98);
    }

    /* Permission Overlay */
    .audio-permission-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .permission-dialog {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 16px 64px rgba(0, 0, 0, 0.8);
    }

    .permission-dialog h2 {
      font-size: 32px;
      margin-bottom: 16px;
    }

    .permission-dialog p {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .permission-dialog button {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .permission-dialog button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 0, 0, 0.4);
    }

    .permission-dialog button:active {
      transform: translateY(0);
    }

    /* Error Overlay */
    .error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .error-dialog {
      background: rgba(40, 0, 0, 0.95);
      border: 2px solid rgba(255, 0, 0, 0.5);
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
    }

    .error-dialog h2 {
      font-size: 28px;
      margin-bottom: 16px;
      color: #ff4444;
    }

    .error-dialog p {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .error-dialog button {
      padding: 12px 24px;
      background: #ff4444;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Scrollbar */
    .ui-container::-webkit-scrollbar {
      width: 6px;
    }

    .ui-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .ui-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .ui-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .ui-container {
        width: 100%;
        max-width: 100%;
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        border-radius: 16px 16px 0 0;
        max-height: 50vh;
        padding: 16px;
      }

      .ui-header h2 {
        font-size: 16px;
      }

      .ui-header p {
        font-size: 11px;
      }

      .param-control {
        margin-bottom: 12px;
      }

      .param-control label {
        font-size: 11px;
      }

      .param-control input[type="range"] {
        height: 6px;
      }

      .param-control input[type="range"]::-webkit-slider-thumb {
        width: 20px;
        height: 20px;
      }

      .param-control input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
      }

      .ui-actions button {
        padding: 12px;
        font-size: 14px;
      }

      .stats-grid {
        font-size: 10px;
      }

      .permission-dialog {
        max-width: 90%;
        padding: 24px;
      }

      .permission-dialog h2 {
        font-size: 24px;
      }

      .permission-dialog button {
        padding: 16px;
        font-size: 16px;
      }
    }

    /* Touch device optimizations */
    @media (hover: none) and (pointer: coarse) {
      .ui-actions button,
      .permission-dialog button {
        min-height: 44px;
        touch-action: manipulation;
      }

      .param-control input[type="range"] {
        touch-action: pan-y;
      }
    }

    /* Landscape mobile */
    @media (max-width: 768px) and (orientation: landscape) {
      .ui-container {
        width: 50%;
        max-width: 400px;
        right: 0;
        left: auto;
        top: 0;
        bottom: 0;
        border-radius: 0;
        max-height: 100vh;
      }
    }

    /* iOS safe area support */
    @supports (padding: max(0px)) {
      .ui-container {
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
      }
    }

    /* Color Palette Browser */
    .ui-palettes {
      margin-bottom: 16px;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .palette-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .palette-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: scale(1.02);
    }

    .palette-item.active {
      border-color: #ff0000;
      background: rgba(255, 0, 0, 0.1);
    }

    .palette-swatches {
      display: flex;
      gap: 2px;
      margin-bottom: 6px;
    }

    .color-swatch {
      flex: 1;
      height: 20px;
      border-radius: 3px;
    }

    .palette-label {
      font-size: 10px;
      text-align: center;
      color: #aaa;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .palette-grid {
        grid-template-columns: 1fr;
      }

      .color-swatch {
        height: 16px;
      }

      .palette-label {
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <canvas id="app-canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
